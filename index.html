<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080e24">
<meta name="description" content="Tiga bulan, satu langit. Ada yang menunggumu di sini.">
<meta property="og:title" content="Tiga Bulan, Satu Langit">
<meta property="og:description" content="Ada sembilan bintang yang menunggumu.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<title>Tiga Bulan, Satu Langit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Figtree:wght@400;500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#080e24;--deep:#101a3c;--dusk:#2b3b78;--gold:#f2c879;--mist:#cfd6ee;--serif:"Fraunces",Georgia,serif;--sans:"Figtree",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 50% 0%,var(--deep),var(--ink) 70%) fixed;color:var(--mist);font:400 1.05rem/1.7 var(--sans);min-height:100vh}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1}
section{padding:4rem 1.25rem;max-width:860px;margin:0 auto}
h1,h2{font-family:var(--serif);font-weight:300;color:#fff;line-height:1.15}
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-top:max(4rem,env(safe-area-inset-top))}
.hero h1{font-size:clamp(2.8rem,10vw,6rem);font-style:italic;letter-spacing:-.02em}
.hero p{max-width:34ch;margin-top:1.2rem;color:var(--mist)}
.count{margin-top:2rem;font-family:var(--serif);font-size:1.4rem;color:var(--gold)}
.btn{margin-top:2rem;background:none;border:1px solid var(--gold);color:var(--gold);padding:.8rem 1.6rem;border-radius:99px;font:500 1rem var(--sans);cursor:pointer;transition:background .25s,color .25s}
.btn:hover,.btn:focus-visible{background:var(--gold);color:var(--ink);outline:none}
h2{font-size:clamp(1.8rem,6vw,2.8rem)}
.hint{margin-top:.6rem;color:#9aa6d0}
.stage{position:relative;width:100%;height:min(78vh,540px);margin-top:1.5rem}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.stage line{stroke:var(--gold);stroke-width:1.2;vector-effect:non-scaling-stroke;opacity:0;transition:opacity 1.2s;stroke-dasharray:3 4}
.stage line.on{opacity:.7}
.star{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;background:none;cursor:pointer;border-radius:50%}
.star::before{content:"";position:absolute;inset:16px;border-radius:50%;background:var(--mist);box-shadow:0 0 12px 3px rgba(207,214,238,.5);animation:pulse 3s ease-in-out infinite;animation-delay:var(--d)}
.star.big::before{inset:12px;background:var(--gold);box-shadow:0 0 20px 6px rgba(242,200,121,.55)}
.star.found::before{background:var(--gold);box-shadow:0 0 16px 5px rgba(242,200,121,.6);animation:none}
.star:focus-visible{outline:2px solid var(--gold)}
@keyframes pulse{50%{transform:scale(.55);opacity:.55}}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:5;max-height:82vh;overflow:auto;background:rgba(16,26,60,.96);border-top:1px solid var(--dusk);border-radius:22px 22px 0 0;padding:1.6rem 1.4rem calc(1.6rem + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(8px)}
.panel.open{transform:none}
.panel .in{max-width:560px;margin:0 auto}
.panel small{color:var(--gold)}
.panel h3{font:300 1.7rem var(--serif);color:#fff;margin:.2rem 0 .8rem}
.panel img{width:100%;max-height:320px;object-fit:cover;border-radius:12px;margin-bottom:1rem}
.x{position:absolute;right:1rem;top:.8rem;background:none;border:0;color:var(--mist);font-size:1.8rem;cursor:pointer}
.meteor{position:fixed;top:12%;left:-10%;width:140px;height:2px;z-index:4;background:linear-gradient(90deg,transparent,#fff);opacity:0;transform:rotate(28deg);pointer-events:none}
.meteor.go{animation:fly 1.1s ease-out}
@keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(28deg)}100%{opacity:0;transform:translate(90vw,48vw) rotate(28deg)}}
.lock{color:#9aa6d0;font-style:italic}
.wish textarea{width:100%;min-height:110px;margin-top:1rem;background:rgba(255,255,255,.05);border:1px solid var(--dusk);border-radius:12px;color:#fff;padding:.9rem;font:inherit}
.wish .btn{margin-top:.8rem}
.mute{position:fixed;right:1rem;top:max(1rem,env(safe-area-inset-top));z-index:6;background:rgba(16,26,60,.8);border:1px solid var(--dusk);color:var(--mist);border-radius:99px;padding:.45rem .9rem;font:500 .85rem var(--sans);cursor:pointer}
footer{text-align:center;padding:3rem 1rem 4rem;color:#7d89b8}
.gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;padding:2rem;background:radial-gradient(ellipse at 50% 30%,#1b2a5e,#060b1c 75%);transition:opacity 1.2s,visibility 1.2s}
.gate.off{opacity:0;visibility:hidden}
.gate h1{font-size:clamp(2rem,8vw,3.6rem);font-style:italic;max-width:14ch;margin:0 auto}
.gate .gk{color:var(--gold);font-family:var(--serif);margin-bottom:1rem}
.gate .btn{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 26px 5px rgba(242,200,121,.45)}}
.hero h1{text-shadow:0 0 34px rgba(242,200,121,.35)}
body:not(.in) .hero>*{opacity:0}
body.in .hero>*{animation:rise 1.3s both}
body.in .hero>:nth-child(2){animation-delay:.5s}
body.in .hero>:nth-child(3){animation-delay:1s}
body.in .hero>:nth-child(4){animation-delay:1.5s}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}
.heart{position:fixed;z-index:30;pointer-events:none;color:var(--gold);animation:up 1.8s ease-out forwards}
@keyframes up{to{opacity:0;transform:translate(var(--dx,0),-170px) scale(1.5)}}
.heart.amb{z-index:0;opacity:.45;animation:amb 9s linear forwards}
@keyframes amb{to{opacity:0;transform:translate(var(--dx),-100vh)}}
.puz{text-align:center}
.puz .bar{display:flex;gap:1rem;align-items:center;justify-content:center;margin-top:1rem;flex-wrap:wrap}
.puz .btn{margin:0;padding:.5rem 1.1rem}
.ref{width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--dusk)}
.board{--n:3;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px;width:min(92vw,440px);aspect-ratio:1;margin:1.5rem auto 0;transition:gap .8s}
.tile{border:0;border-radius:8px;cursor:pointer;padding:0;transition:transform .2s,box-shadow .2s,border-radius .8s}
.tile.sel{transform:scale(.92);box-shadow:0 0 0 3px var(--gold)}
.board.done{gap:0;box-shadow:0 0 50px rgba(242,200,121,.35)}
.board.done .tile{border-radius:0;pointer-events:none}
.kata{margin:2rem auto 0;max-width:30rem;font-family:var(--serif);font-weight:300;font-size:1.25rem;line-height:1.9;color:#fff}
.kata p{opacity:0;transform:translateY(10px);transition:opacity 1.3s,transform 1.3s}
.kata p.show{opacity:1;transform:none}
.kata p+p{margin-top:.9rem}
.stage.full line{opacity:1;filter:drop-shadow(0 0 5px var(--gold))}
.kuis{text-align:center}
#kbox{max-width:30rem;margin:1.5rem auto 0}
.kh{font-family:var(--serif);font-size:1.2rem;color:#fff;margin:1rem 0;min-height:1.6em}
.opt{display:block;width:100%;margin-top:.7rem;padding:.8rem 1rem;background:rgba(255,255,255,.05);border:1px solid var(--dusk);border-radius:12px;color:var(--mist);font:inherit;cursor:pointer;transition:border-color .2s,background .2s}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--gold);outline:none}
.opt.ok{border-color:var(--gold);background:rgba(242,200,121,.15);color:#fff}
.opt.no{opacity:.45}
.small{display:block;margin-top:.4rem;font-size:1rem;color:var(--mist);font-family:var(--sans)}
.stage line{opacity:.13}
.tag{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:-4px;white-space:nowrap;font:italic 300 .85rem var(--serif);color:var(--gold);opacity:0;transition:opacity 1.2s;pointer-events:none;text-shadow:0 0 8px var(--ink)}
.star.found .tag{opacity:.9}
.star.found::after{content:"";position:absolute;inset:10px;border:1px solid var(--gold);border-radius:50%;animation:ring 1.4s ease-out 1}
@keyframes ring{from{transform:scale(.5);opacity:1}to{transform:scale(2.8);opacity:0}}
.stage.full .star.found::before{animation:pulse 2.4s ease-in-out infinite;animation-delay:var(--d)}
#rasi{text-align:center;font:italic 300 clamp(1.7rem,6vw,2.5rem) var(--serif);color:var(--gold);text-shadow:0 0 26px rgba(242,200,121,.55);margin-top:1rem;opacity:0;transition:opacity 2.5s}
#rasi.show{opacity:1}
.amplop{position:relative;width:min(88vw,340px);height:220px;margin:2rem auto 0;background:linear-gradient(160deg,#eadfc7,#d5c3a1);border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.45);cursor:pointer;display:grid;place-items:end center;padding-bottom:1rem;color:#6b5a3a;font:italic 1rem var(--serif);animation:float 4s ease-in-out infinite}
.amplop[hidden],.kertas[hidden]{display:none}
.amplop .flap{position:absolute;inset:0 0 45% 0;background:linear-gradient(#dccbaa,#cdb98f);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:8px 8px 0 0}
.seal{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:radial-gradient(#e0555e,#a02a35);color:#fff;display:grid;place-items:center;font-size:1.5rem;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:beat 1.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes beat{50%{transform:translate(-50%,-50%) scale(1.12)}}
.amplop:focus-visible{outline:2px solid var(--gold)}
.kertas{max-width:34rem;margin:2rem auto 0;background:#f6efe0;color:#3b3224;border-radius:6px;padding:2rem 1.6rem;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:rise 1s both;text-align:center}
#ketik{font:500 1.5rem/1.65 "Caveat","Segoe Script","Bradley Hand",cursive;white-space:pre-wrap;text-align:left;min-height:6rem}
#ketik::after{content:"▍";opacity:.5;animation:blink 1s steps(1) infinite}
#ketik.end::after{content:""}
@keyframes blink{50%{opacity:0}}
.kertas .hint{color:#8a7a5a;font-size:.85rem}
.kertas .btn{border-color:#a02a35;color:#a02a35}
.kertas .btn:hover,.kertas .btn:focus-visible{background:#a02a35;color:#fff}
body:not(.in){overflow:hidden}
.hero h1{white-space:pre-line}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="gate" id="gate"><div>
  <p class="gk" data-t="gerbangUntuk"></p>
  <h1 data-t="gerbangJudul"></h1>
  <button class="btn" id="buka" data-t="gerbangTombol"></button>
  <p class="hint" data-t="gerbangHint"></p>
</div></div>
<div class="meteor" id="meteor"></div>
<button class="mute" id="mute" hidden></button>
<audio id="bgm" loop preload="none"></audio>

<main>
<section class="hero">
  <h1 data-t="heroJudul"></h1>
  <p id="sapa" data-t="heroSapa"></p>
  <div class="count" id="count"></div>
  <button class="btn" id="mulai" data-t="heroTombol"></button>
</section>

<section id="langit">
  <h2 data-t="langitJudul"></h2>
  <p class="hint"><span data-t="langitHint"></span> <span id="prog"></span></p>
  <div class="stage" id="stage"><svg viewBox="0 0 100 100" preserveAspectRatio="none" id="lines"></svg></div>
  <p id="rasi"></p>
</section>

<section class="puz" id="puzzle">
  <h2 data-t="puzzleJudul"></h2>
  <p class="hint" data-t="puzzleHint"></p>
  <div class="bar"><img class="ref" id="ref" alt="Petunjuk gambar"><span class="hint" id="langkah"></span><button class="btn" id="acak" data-t="puzzleAcak"></button><button class="btn" id="lain" data-t="puzzleLain" hidden></button><button class="btn" id="tk"></button></div>
  <div class="board" id="board"></div>
  <div class="kata" id="kata"></div>
</section>

<section class="kuis" id="kuis">
  <h2 data-t="kuisJudul"></h2>
  <p class="hint" data-t="kuisHint"></p>
  <div id="kbox"></div>
</section>

<section id="surat">
  <h2 data-t="suratJudul"></h2>
  <div id="isi" class="lock" style="margin-top:1.5rem" data-t="suratKunci"></div>
  <div class="amplop" id="amplop" role="button" tabindex="0" aria-label="Buka surat" hidden><div class="flap"></div><div class="seal">♥</div><span data-t="amplopTeks"></span></div>
  <div class="kertas" id="kertas" hidden>
    <div id="ketik" aria-live="polite"></div>
    <p class="hint" id="skip" data-t="suratSkip"></p>
    <button class="btn" id="peluk" data-t="peluk" hidden></button>
  </div>
</section>

<section class="wish">
  <h2 data-t="harapJudul"></h2>
  <p class="hint" data-t="harapHint"></p>
  <textarea id="harap"></textarea>
  <button class="btn" id="simpan" data-t="harapTombol"></button>
  <p class="hint" id="ok"></p>
</section>
</main>
<footer id="foot" data-t="footer"></footer>

<aside class="panel" id="panel" aria-live="polite">
  <button class="x" id="tutup" aria-label="Tutup">×</button>
  <div class="in" id="pin"></div>
</aside>

<script>
/* ====== EDIT BAGIAN INI SAJA ====== */
const C = {
  kamu: "My Mine Dinda Maghfirah Al Ayyubi",
  aku: "Aku",
  rasi: "Rasi Dinda & Aku",       // nama rasi yang muncul saat semua bintang terbuka
  wa: "6281543193106",            // nomor WhatsApp penerima harapan (format 62…, tanpa 0 di depan)
  mulai: "2026-08-12",            // tanggal jadian (YYYY-MM-DD)
  musik: "musik.mp3",             // taruh file mp3 sejajar index.html; kosongkan "" kalau tidak pakai
  teks: {                         // SEMUA tulisan di web ada di sini. {kamu} {aku} {n} dst. diisi otomatis, jangan dihapus
    judul: "Happy 3rd Monsarry",
    gerbangUntuk: "Untuk {kamu}",
    gerbangJudul: "Ada yang menunggumu di langit malam",
    gerbangTombol: "Buka langit kita",
    gerbangHint: "Nyalakan suaranya, ya. Ada lagu untukmu.",
    heroJudul: "Tiga bulan,\nsatu langit.",
    heroSapa: "Untuk {kamu}. Di bawah ada sembilan bintang, satu untuk setiap cerita yang kita simpan.",
    heroTombol: "Lihat langit kita",
    hariTeks: "{n} hari di bawah langit yang sama",
    hitungMundur: "{n} hari lagi menuju bulan ke-{m}",
    hariH: "Hari ini hari jadian kita. Selamat bulan ke-{m}!",
    langitJudul: "Sembilan bintang kita",
    langitHint: "Sentuh tiap bintang. Setiap satu menyimpan satu cerita, dan semuanya akan saling tersambung.",
    progres: "({n} dari {total})",
    rasiUtuh: "Rasi kita sudah utuh.",
    panelBulan: "Bulan ke-{bln} · {tgl}",
    puzzleJudul: "Susun kenangan kita",
    puzzleHint: "Ketuk dua kepingan untuk menukarnya, sampai fotonya utuh kembali.",
    langkah: "{n} langkah",
    puzzleAcak: "Acak ulang",
    puzzleLain: "Foto lain",
    puzzleSulit: "Lebih sulit (4×4)",
    puzzleMudah: "Lebih mudah (3×3)",
    kuisJudul: "Kuis santai: seberapa kenal kamu sama kita?",
    kuisHint: "Lima pertanyaan santai. Jawab jujur ya, awas ketahuan! Di sini “aku” itu kamu yang lagi jawab, dan “kamu” itu aku.",
    kuisNomor: "{n} dari {total}.",
    kuisSempurna: "Nilai sempurna! Fix kamu yang paling kenal aku.",
    kuisBiasa: "Skormu {skor} dari {total}. Lumayan lah, sisanya kita pelajari bareng di bulan keempat ya.",
    kuisUlang: "Main lagi",
    suratJudul: "Surat di balik rasi",
    suratKunci: "Temukan semua bintang dulu, ya. Surat ini menunggu di ujung rasi.",
    amplopTeks: "Ketuk untuk membuka",
    suratSkip: "Ketuk suratnya untuk mempercepat.",
    peluk: "Balas dengan peluk",
    pelukWA: "Suratnya udah kubaca. Peluk dulu sini, aku juga sayang kamu.",
    harapJudul: "Titip satu harapan",
    harapHint: "Tulis harapanmu untuk bulan keempat, lalu kirim lewat WhatsApp.",
    harapPlaceholder: "Di bulan keempat, aku ingin…",
    harapTombol: "Kirim lewat WhatsApp",
    harapKosong: "Tulis dulu harapannya, ya.",
    harapOk: "WhatsApp akan terbuka. Tinggal tekan kirim, ya.",
    harapWA: "Harapanku untuk bulan keempat kita: {isi}",
    footer: "Dibuat dengan sayang oleh {aku} untuk {kamu}.",
    musikPutar: "Putar musik",
    musikJeda: "Jeda musik"
  },
  puzzle: {
    foto: ["puzzle.jpg","puzzle2.jpg","puzzle3.jpg"], // daftar foto, sejajar index.html. Yang tidak ada dilewati; kalau semua kosong dipakai gambar hati
    ukuran: 3,                    // 3 = 3x3 kepingan; 4 = lebih sulit
    kata: [
      "Kamu berhasil menyusunnya, seperti kita menyusun hari demi hari.",
      "Tiga bulan ini aku belajar, bahagia itu sederhana: ada kamu di ujung setiap cerita.",
      "Terima kasih sudah jadi bagian terindah di langitku. Aku sayang kamu, Cintakuu."
    ]
  },
  kuis: [                         // b = nomor jawaban benar (mulai 0); b:-1 = semua jawaban benar; r = balasan per pilihan
    {t:"Kita resmi jadian tanggal berapa, hayo?", p:["12 Agustus","12 September","12 Oktober"], b:0, ok:"Yeay, benar! Awas ya kalau sampai lupa, hehe.", no:"Yah salah! Tanggal 12 Agustus, catat baik-baik ya."},
    {t:"Udah berapa bulan kita barengan?", p:["Dua bulan","Tiga bulan","Empat bulan"], b:1, ok:"Yeayy, Betul! Rasanya kok cepet banget yaa.", no:"Kok bisa salah sih? Kita udah tiga bulan lho sayang"},
    {t:"Siapa yang paling sering kangen duluan?", p:["Aku","Kamu","Sama-sama, tapi gengsi"], b:-1, r:["Ciee ngaku Padahal kemarin gengsi, hehe. Tenang, aku juga kangen banget kok.","Iya sih, aku emang gampang luluh kalau udah kangen. Nggak bisa bohong, hehe.","Sama-sama gengsi, sama-sama kangen. Cocok banget kita."]},
    {t:"Siapa yang lebih sabar di antara kita?", p:["Aku","Kamu","Gantian aja"], b:-1, r:["Wih, percaya diri banget! Tapi iya sih, kamu sabar banget ngadepin aku.","Makasih udah ngakuin, padahal sabarku sering tipis. Kamu yang bikin aku belajar sabar.","Gantian sabarnya, makanya awet. Jawaban paling aman, hehe."]},
    {t:"Terus siapa yang paling sering bikin marah?", p:["Aku","Kamu","Nggak ada, cuma lagi capek"], b:-1, r:["Ngaku sendiri nih? Tenang, aku tetep sayang kok, semarah apa pun.","Nah, ngakuu Iya iya, maaf ya, aku usahain nggak bikin kamu kesel lagi.","Jawaban paling bijak. Kayaknya kita berdua cuma butuh makan dan tidur, hehe."]}
  ],
  bintang: [                      // x,y = posisi (0–100), foto = nama file sejajar index.html (boleh kosong)
    {x:12,y:72,bln:1,judul:"Keceplosan manis",    tgl:"12 Agustus",  foto:"1.jpg",teks:"Kamu bilang, “mauu peyukk peyukk pacall, ehh, bukan yaa?” Kedengarannya cuma keceplosan, tapi jantungku langsung nggak karuan. Dan aku jawab, “Lohh kok pacal, kan aku suami kamu cintaa❤️.” Nggak ada bunga, nggak ada rencana, cuma dua orang yang kebetulan jujur di waktu yang pas. Cara paling kamu banget buat memulai, dan sampai sekarang aku nggak pernah menyesal."},
    {x:24,y:46,bln:1,judul:"Obrolan panjang",tgl:"Agustus",   foto:"2.jpg",teks:"Kita bisa ngobrol dari hal penting sampai hal-hal sepele yang nggak ada gunanya, dan anehnya aku nggak pernah bosan. Kadang aku senyum-senyum sendiri baca chat kamu. Suara kamu itu rumah paling nyaman buat pulang di akhir hari."},
    {x:36,y:64,bln:1,judul:"Kabar singkat",  tgl:"Agustus",    foto:"3.jpg",teks:"kedengarannya sepele, tapi dari kamu rasanya kayak pelukan. Aku suka cara kamu perhatian lewat hal-hal kecil, yang mungkin kamu sendiri nggak sadar. Dari situ aku belajar, sayang itu sering bersembunyi di kalimat yang paling sederhana."},
    {x:46,y:32,bln:2,judul:"Dua bulan",    tgl:"12 September",foto:"4.png",teks:"Dua bulan, dan aku makin yakin sama kamu. Bukan karena semuanya selalu mulus, tapi karena di hari-hari yang berantakan pun kamu tetap bikin aku merasa cukup. Kamu alasan aku pengen jadi lebih baik, pelan-pelan, tanpa merasa dipaksa."},
    {x:57,y:54,bln:2,judul:"Tawa yang sama",tgl:"September", foto:"5.jpg",teks:"Kita bisa ketawa di hal yang sama padahal jaraknya jauh. Itu ajaib banget buat aku. Tawamu kayak lagu favorit yang bisa kuputar berulang-ulang dan nggak pernah bikin bosan."},
    {x:66,y:24,bln:2,judul:"Rindu",        tgl:"Oktober",    foto:"6.jpg",teks:"Jujur, rindu itu berat. Ada malam-malam di mana aku cuma pengen kamu ada di sebelahku, sambil ngomel soal hal nggak penting pun nggak apa-apa. Tapi aku percaya, tiap rindu yang kita tahan hari ini bakal terbayar pas kita ketemu lagi. Peluknya nanti dobel, ya."},
    {x:76,y:58,bln:3,judul:"Saling percaya",tgl:"Oktober",   foto:"7.jpg",teks:"Percaya itu bukan sekali jadi, tapi dipilih tiap hari. Dan tiap hari juga aku milih kamu: kejujuranmu, ceritamu, bahkan sisi kamu yang lagi nggak baik-baik aja. Kamu boleh bersandar sepuasnya, aku nggak akan ke mana-mana."},
    {x:87,y:36,bln:3,judul:"Mimpi bersama",tgl:"November",   foto:"8.jpg",teks:"Pelan-pelan kita mulai ngobrolin masa depan, dan aku suka banget bayangannya. Ada kamu di tiap gambarnya. Nggak harus yang besar-besar, cukup kita saling dukung sampai satu per satu mimpi itu jadi nyata."},
    {x:50,y:82,bln:3,judul:"Tiga bulan",   tgl:"12 November",foto:"9.jpg",big:true,teks:"Ini bintang paling terang, khusus buat hari ini. Tiga bulan lalu aku cuma bisa berharap, sekarang aku bersyukur banget kamu ada. Terima kasih udah sabar, udah hangat, udah tinggal. Aku sayang kamu, Dinda, dan aku masih mau banyak bulan lagi bareng kamu."}
  ],
  surat: [
    "Sayangg,",
    "Tiga bulan ini aku belajar satu hal: rindu bisa sebesar itu. Ada malam-malam di mana aku kangen kamu sampai nggak sadar air mataku udah jatuh. Pengen banget lihat muka kamu dan dengar tawa kamu, kalo bisa secara langsung hehe, tapi it’s okayyy. Rindu ini kusimpan baik-baik, buat kita ketemu nanti yaa hehe.",
    "Dari semua hal yang terjadi, aku paling bersyukur sama satu: kamu yang keceplosan hari itu. Kalimat sesederhana itu ternyata jadi awal dari hari-hari yang paling aku tunggu. Sekarang tiap HP-ku bunyi dan itu kamu, hariku langsung terasa lengkap.",
    "Aku juga mau minta maaf. Kamu ketemunya cowok yang belum sempurna, yang kadang berantakan dan mungkin tanpa sengaja pernah bikin kamu sakit hati. Makin lama kamu kenal aku, makin banyak sisiku yang kamu lihat, dan kamu tetap di sini. Itu yang bikin aku pengen jadi lebih baik tiap hari.",
    "Satu lagi, aku bersyukur banget punya kamu, sayang. Dan apa pun yang kamu rasain, ceritain aja ke aku. Aku siap dengerin, yang ringan maupun yang berat. Aku pengen jadi tempat kamu pulang, bukan tempat kamu menahan diri.",
    "Aku sayang banget sama kamu. Makasih udah mau jadi rumahku, sejauh apa pun jaraknya.",
    "Happy 3rd Monthsarry, cintaku.",
    "P.S. Kalau udah selesai baca, jangan lupa tombol peluk di bawah, ya. Aku nungguin lho."
  ]
};
/* ================================== */

const $ = id => document.getElementById(id);
const T = (k, v) => { v = Object.assign({kamu: C.kamu, aku: C.aku}, v); return String(C.teks[k]).replace(/\{(\w+)\}/g, (m, x) => x in v ? v[x] : m); };
document.querySelectorAll("[data-t]").forEach(el => el.textContent = T(el.dataset.t));
document.title = T("judul"); $("harap").placeholder = T("harapPlaceholder"); $("mute").textContent = T("musikPutar");
const S = C.bintang, N = S.length;
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };

const hari = Math.max(0, Math.floor((Date.now() - new Date(C.mulai + "T00:00:00")) / 864e5));
$("count").textContent = T("hariTeks", {n: hari});
$("mulai").onclick = () => $("langit").scrollIntoView();

/* langit berbintang */
const cv = $("sky"), cx = cv.getContext("2d"); let dots = [];
function size(){ cv.width = innerWidth; cv.height = innerHeight;
  dots = Array.from({length: Math.min(170, innerWidth/5)}, () => ({x:Math.random()*cv.width, y:Math.random()*cv.height, r:Math.random()*1.3+.2, p:Math.random()*6.3, s:Math.random()*.02+.005})); }
function draw(t){ cx.clearRect(0,0,cv.width,cv.height);
  for(const d of dots){ cx.globalAlpha = .35 + .65*Math.abs(Math.sin(d.p + t*d.s*.06)); cx.fillStyle = "#e8ecff"; cx.beginPath(); cx.arc(d.x,((d.y-scrollY*d.r*.15)%cv.height+cv.height)%cv.height,d.r,0,6.3); cx.fill(); }
  if(!matchMedia("(prefers-reduced-motion:reduce)").matches) requestAnimationFrame(draw); }
addEventListener("resize", size); size(); requestAnimationFrame(draw);

/* rasi */
let dibuka = false; let found = new Set(JSON.parse(store.get("found") || "[]"));
const stage = $("stage"), svg = $("lines"), NS = "http://www.w3.org/2000/svg";
const lines = [], btns = [];
for(let i=0;i<N-1;i++){ const l = document.createElementNS(NS,"line");
  l.setAttribute("x1",S[i].x); l.setAttribute("y1",S[i].y); l.setAttribute("x2",S[i+1].x); l.setAttribute("y2",S[i+1].y); svg.appendChild(l); lines.push(l); }
S.forEach((s,i) => { const b = document.createElement("button");
  b.className = "star" + (s.big ? " big" : ""); b.style.left = s.x + "%"; b.style.top = s.y + "%"; b.style.setProperty("--d", (i*.37)+"s");
  b.setAttribute("aria-label", "Bintang " + (i+1) + ": " + s.judul); b.insertAdjacentHTML("beforeend", "<span class='tag'>" + s.judul + "</span>"); b.onclick = () => buka(i); stage.appendChild(b); btns.push(b); });

function refresh(){
  btns.forEach((b,i) => b.classList.toggle("found", found.has(i)));
  lines.forEach((l,i) => l.classList.toggle("on", found.has(i) && found.has(i+1)));
  $("prog").textContent = found.size === N ? T("rasiUtuh") : T("progres", {n: found.size, total: N}); stage.classList.toggle("full", found.size === N);
  $("rasi").classList.toggle("show", found.size === N);
  if(found.size === N){ $("isi").hidden = true; if(!dibuka) $("amplop").hidden = false; }
}
function buka(i){
  const s = S[i], sudah = found.size === N; found.add(i); store.set("found", JSON.stringify([...found]));
  $("pin").innerHTML = "<small>" + T("panelBulan", {bln: s.bln, tgl: s.tgl}) + "</small><h3>" + s.judul + "</h3>" +
    (s.foto ? '<img src="' + s.foto + '" alt="" onerror="this.remove()">' : "") + "<p>" + s.teks + "</p>";
  $("panel").classList.add("open");
  meteor();
  refresh();
  if(found.size === N && !sudah){ hujan(); [900,2300,3700].forEach(t => setTimeout(meteor, t)); setTimeout(() => { tutup(); $("surat").scrollIntoView(); }, 6500); }
}
function tutup(){ $("panel").classList.remove("open"); }
$("tutup").onclick = tutup;
addEventListener("keydown", e => { if(e.key === "Escape") tutup(); });
refresh();

/* harapan */
$("harap").value = store.get("harap") || "";
$("simpan").onclick = () => { const t = $("harap").value.trim();
  if(!t){ $("ok").textContent = T("harapKosong"); return; }
  store.set("harap", t); $("ok").textContent = T("harapOk");
  window.open("https://wa.me/" + C.wa + "?text=" + encodeURIComponent(T("harapWA", {isi: t})), "_blank"); };

/* musik, hati, bintang jatuh */
const bgm = $("bgm"), mute = $("mute"), calm = matchMedia("(prefers-reduced-motion:reduce)").matches;
function meteor(){ const m = $("meteor"); m.style.top = (5 + Math.random()*30) + "%"; m.classList.remove("go"); void m.offsetWidth; m.classList.add("go"); }
function hati(x,y,amb){ const h = document.createElement("span"); h.className = "heart" + (amb ? " amb" : ""); h.textContent = "♥";
  h.style.cssText = "left:"+x+"px;top:"+y+"px;font-size:"+(10+Math.random()*16)+"px;--dx:"+(Math.random()*80-40)+"px"; document.body.appendChild(h); setTimeout(() => h.remove(), amb ? 9000 : 1800); }
function hujan(){ for(let i=0;i<30;i++) setTimeout(() => hati(Math.random()*innerWidth, innerHeight*(.4+Math.random()*.5)), i*60); }
if(!calm){ addEventListener("pointerdown", e => hati(e.clientX, e.clientY)); setInterval(() => hati(Math.random()*innerWidth, innerHeight, true), 2600); setInterval(meteor, 9000); }

/* gerbang pembuka: ketukan ini yang mengizinkan musik berbunyi otomatis */
$("rasi").textContent = C.rasi;
$("buka").onclick = () => {
  $("gate").classList.add("off"); document.body.classList.add("in"); scrollTo(0,0); meteor();
  if(C.musik){ mute.hidden = false; mute.textContent = T("musikPutar"); bgm.src = C.musik; bgm.loop = true; bgm.volume = 0;
    bgm.play().then(() => { mute.textContent = T("musikJeda"); let v = 0; const f = setInterval(() => { v = Math.min(.7, v+.05); bgm.volume = v; if(v >= .7) clearInterval(f); }, 200); }).catch(() => {}); }
};
mute.onclick = () => { if(bgm.paused){ bgm.play().catch(() => {}); mute.textContent = T("musikJeda"); } else { bgm.pause(); mute.textContent = T("musikPutar"); } };

/* puzzle foto */
const P = C.puzzle, board = $("board"); let n = P.ukuran, order, sel = null, langkah = 0, selesai = false, gambar = "";
function cadangan(){ const c = document.createElement("canvas"); c.width = c.height = 600; const g = c.getContext("2d");
  const gr = g.createLinearGradient(0,0,600,600); gr.addColorStop(0,"#1b2a5e"); gr.addColorStop(1,"#080e24"); g.fillStyle = gr; g.fillRect(0,0,600,600);
  g.fillStyle = "#e8ecff"; for(let i=0;i<70;i++){ g.globalAlpha = Math.random()*.8+.2; g.beginPath(); g.arc(Math.random()*600, Math.random()*600, Math.random()*2+.5, 0, 6.3); g.fill(); } g.globalAlpha = 1;
  g.fillStyle = "#f2c879"; g.shadowColor = "#f2c879"; g.shadowBlur = 30; g.beginPath(); g.moveTo(300,480); g.bezierCurveTo(80,330,130,140,300,230); g.bezierCurveTo(470,140,520,330,300,480); g.fill();
  g.shadowBlur = 0; g.fillStyle = "#080e24"; g.font = "italic 70px Georgia,serif"; g.textAlign = "center"; g.fillText("Kita", 300, 335); return c.toDataURL(); }
function acak(){ do{ order = [...Array(n*n).keys()].sort(() => Math.random()-.5); }while(order.every((v,i) => v === i));
  sel = null; langkah = 0; selesai = false; board.classList.remove("done"); $("kata").innerHTML = ""; gambarkan(); }
function gambarkan(){ board.style.setProperty("--n", n); board.innerHTML = ""; $("langkah").textContent = T("langkah", {n: langkah});
  order.forEach((v,pos) => { const t = document.createElement("button"); t.className = "tile" + (sel === pos ? " sel" : "");
    t.style.backgroundImage = "url(" + gambar + ")"; t.style.backgroundSize = (n*100) + "% " + (n*100) + "%";
    t.style.backgroundPosition = ((v%n)/(n-1)*100) + "% " + (Math.floor(v/n)/(n-1)*100) + "%";
    t.setAttribute("aria-label", "Kepingan " + (pos+1)); t.onclick = () => pilih(pos); board.appendChild(t); }); }
function pilih(pos){ if(selesai) return;
  if(sel === null){ sel = pos; } else { [order[sel], order[pos]] = [order[pos], order[sel]]; sel = null; langkah++; }
  gambarkan();
  if(order.every((v,i) => v === i)){ selesai = true; board.classList.add("done"); hujan(); meteor();
    $("kata").innerHTML = P.kata.map(k => "<p>" + k + "</p>").join(""); document.querySelectorAll("#kata p").forEach((p,i) => setTimeout(() => p.classList.add("show"), 900 + i*1700)); } }
$("acak").onclick = acak;
const daftar = []; let fi = 0;
const cek = src => new Promise(r => { const i = new Image(); i.onload = () => r(src); i.onerror = () => r(null); i.src = src; });
function pasang(k){ fi = k % daftar.length; gambar = daftar[fi]; $("ref").src = gambar; $("lain").hidden = daftar.length < 2; acak(); }
Promise.all([].concat(P.foto).map(cek)).then(h => { h.forEach(x => x && daftar.push(x)); if(!daftar.length) daftar.push(cadangan()); pasang(0); });
$("lain").onclick = () => pasang(fi+1);
const tk = $("tk"); const labelTk = () => tk.textContent = n === 3 ? T("puzzleSulit") : T("puzzleMudah"); labelTk();
tk.onclick = () => { n = n === 3 ? 4 : 3; labelTk(); acak(); };

/* hitung mundur bulan berikutnya */
(() => { const d0 = new Date(C.mulai + "T00:00:00"), t = new Date(); t.setHours(0,0,0,0);
  let m = (t.getFullYear()-d0.getFullYear())*12 + t.getMonth()-d0.getMonth(), tg = new Date(d0.getFullYear(), d0.getMonth()+m, d0.getDate());
  if(tg < t){ m++; tg = new Date(d0.getFullYear(), d0.getMonth()+m, d0.getDate()); }
  const sisa = Math.round((tg-t)/864e5);
  $("count").innerHTML += '<span class="small">' + (sisa === 0 ? T("hariH", {m}) : T("hitungMundur", {n: sisa, m})) + "</span>"; })();

/* kuis */
const Q = C.kuis; let qi = 0, skor = 0;
function tanya(){ const q = Q[qi], box = $("kbox");
  if(!q){ box.innerHTML = "<p class='kh'>" + (skor === Q.length ? T("kuisSempurna") : T("kuisBiasa", {skor, total: Q.length})) + "</p><button class='btn' id='ulang'>" + T("kuisUlang") + "</button>";
    if(skor === Q.length) hujan(); $("ulang").onclick = () => { qi = 0; skor = 0; tanya(); }; return; }
  box.innerHTML = "<p class='kh'>" + T("kuisNomor", {n: qi+1, total: Q.length}) + " " + q.t + "</p>" + q.p.map((o,i) => "<button class='opt' data-i='" + i + "'>" + o + "</button>").join("") + "<p class='kh' id='fb'></p>";
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => { const i = +b.dataset.i, benar = q.b < 0 || i === q.b;
    box.querySelectorAll(".opt").forEach(x => x.disabled = true); b.classList.add(benar ? "ok" : "no");
    if(benar){ skor++; const r = b.getBoundingClientRect(); hati(r.left+30, r.top); }
    $("fb").textContent = q.r ? q.r[i] : (benar ? q.ok : q.no); setTimeout(() => { qi++; tanya(); }, 3000); }); }
tanya();

/* surat: amplop, ketikan, peluk */
function bukaSurat(){ if(dibuka) return; dibuka = true; $("amplop").hidden = true; const k = $("kertas"); k.hidden = false; hujan();
  const teks = C.surat.join("\n\n"), el = $("ketik"); let i = 0, cepat = false; k.onclick = () => cepat = true;
  (function t(){ if(i < teks.length){ i = Math.min(teks.length, i + (cepat ? 5 : 1)); el.textContent = teks.slice(0, i); setTimeout(t, cepat ? 10 : 24); }
    else { el.classList.add("end"); $("skip").hidden = true; $("peluk").hidden = false; } })(); }
$("amplop").onclick = bukaSurat; $("amplop").onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); bukaSurat(); } };
$("peluk").onclick = () => { hujan(); window.open("https://wa.me/" + C.wa + "?text=" + encodeURIComponent(T("pelukWA")), "_blank"); };
bgm.addEventListener("error", () => { mute.hidden = true; });
</script>
</body>
</html>
